const KEY = 'ld_pw';
function b64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0));}
async function decrypt(pw){
  const enc=new TextEncoder();
  const km=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey(
    {name:'PBKDF2',salt:b64(ENC.salt),iterations:ENC.iter,hash:'SHA-256'},
    km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(ENC.iv)},key,b64(ENC.ct));
  return new TextDecoder().decode(pt);
}
async function unlock(pw,remember,silent){
  try{
    const html=await decrypt(pw);
    if(remember) localStorage.setItem(KEY,pw);
    try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}
    document.open();document.write(html);document.close();
  }catch(e){
    if(!silent){localStorage.removeItem(KEY);
      document.getElementById('err').textContent='パスワードが違うみたい';}
  }
}
document.getElementById('go').onclick=()=>unlock(document.getElementById('pw').value,document.getElementById('remember').checked,false);
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('go').click();});
const hashPw=decodeURIComponent((location.hash||'').replace(/^#k=/,'').replace(/^#/,''));
const saved=localStorage.getItem(KEY);
if(hashPw){unlock(hashPw,true,false);}
else if(saved){unlock(saved,true,true);}
else{document.getElementById('pw').focus();}
</script></body></html>
