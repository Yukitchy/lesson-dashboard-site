<title>🔒 レッスンダッシュボード</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:#f4f6fb;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;}
.box{border-radius:16px;background:#fff;box-shadow:0 4px 24px rgba(0,0,0,.12);
  padding:26px 24px;width:min(360px,86vw);text-align:center;}
.box h1{margin:0 0 14px;font-size:20px;}
.box input{width:100%;border:2px solid #cbd5e1;border-radius:10px;padding:11px 13px;font-size:16px;
  box-sizing:border-box;background:#fff;margin-bottom:12px;}
.box label{display:flex;gap:7px;align-items:center;justify-content:center;font-size:13px;font-weight:600;margin-bottom:14px;}
.box button{border:none;background:#2f6fed;color:#fff;font-weight:700;font-size:16px;border-radius:10px;
  padding:11px 16px;width:100%;cursor:pointer;}
.err{color:#c0392b;font-size:13px;font-weight:600;min-height:18px;margin-top:10px;}
</style></head><body>

const KEY = 'ld_pw';
function b64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0));}
async function decrypt(pw){
  const enc=new TextEncoder();
  const km=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey(
    {name:'PBKDF2',salt:b64(ENC.salt),iterations:ENC.iter,hash:'SHA-256'},
    km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(ENC.iv)},key,b64(ENC.ct));
  return new TextDecoder().decode(pt);
}
async function unlock(pw,remember,silent){
  try{
    const html=await decrypt(pw);
    if(remember) localStorage.setItem(KEY,pw);
    try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}
    document.open();document.write(html);document.close();
  }catch(e){
    if(!silent){localStorage.removeItem(KEY);
      document.getElementById('err').textContent='パスワードが違うみたい';}
  }
}
document.getElementById('go').onclick=()=>unlock(document.getElementById('pw').value,document.getElementById('remember').checked,false);
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('go').click();});
const hashPw=decodeURIComponent((location.hash||'').replace(/^#k=/,'').replace(/^#/,''));
const saved=localStorage.getItem(KEY);
if(hashPw){unlock(hashPw,true,false);}
else if(saved){unlock(saved,true,true);}
else{document.getElementById('pw').focus();}
</script></body></html>
